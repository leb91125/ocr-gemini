<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trích Xuất Văn Bản - PMTL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <style>
        /* --- CẤU HÌNH GIAO DIỆN CHUNG --- */
        :root {
            --color-primary: #78350f; /* Amber 900 */
            --color-bg: #fdfaf6;      /* Cream White */
        }
        body { 
            font-family: 'Be Vietnam Pro', sans-serif; 
            background-color: var(--color-bg);
            height: 100dvh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        .font-serif { font-family: 'Cormorant Garamond', serif; }

        /* --- PANZOOM & IMAGE AREA --- */
        #panzoom-wrapper {
            width: 100%; height: 100%; overflow: hidden; position: relative;
            background-color: #1c1917; /* Stone 900 */
            display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
        }
        #panzoom-content {
            touch-action: none; cursor: grab; transform-origin: center center;
            display: flex; justify-content: center; align-items: center;
        }
        #panzoom-content:active { cursor: grabbing; }

        /* --- CONTROLS --- */
        .zoom-btn {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            width: 40px; height: 40px; color: white;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .zoom-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }

        /* --- LOADING & TOAST --- */
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #d97706;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Toast Notification */
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background-color: #78350f; color: white; padding: 10px 20px;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 14px; font-weight: 500; z-index: 100;
            opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            display: flex; align-items: center; gap: 8px;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <header class="h-14 bg-white/90 backdrop-blur border-b border-amber-100 flex items-center justify-between px-4 flex-none z-20 shadow-sm">
        <div class="font-serif font-bold text-xl text-[#78350f] flex items-center gap-2">
            <i class="fa-solid fa-camera-retro"></i> Trích Xuất Văn Bản
        </div>
        <select id="langSelect" class="text-xs font-medium border border-amber-200 rounded-lg px-2 py-1.5 bg-amber-50 text-[#78350f] focus:outline-none">
            <option value="chs">Trung (Giản)</option>
            <option value="cht">Trung (Phồn)</option>
            <option value="vie">Tiếng Việt</option>
            <option value="eng">Tiếng Anh</option>
        </select>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <div class="h-[50%] md:h-full w-full md:w-1/2 relative border-b md:border-b-0 md:border-r border-gray-200 flex-none z-10 group">
            
            <div class="absolute top-4 right-4 z-50 flex flex-col gap-2">
                <button onclick="zoomIn()" class="zoom-btn"><i class="fa-solid fa-plus"></i></button>
                <button onclick="zoomOut()" class="zoom-btn"><i class="fa-solid fa-minus"></i></button>
                <button onclick="resetZoom()" class="zoom-btn text-amber-300"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <div id="panzoom-wrapper">
                <div id="panzoom-content">
                    <img id="image-display" src="" class="hidden max-w-none shadow-2xl pointer-events-none" style="max-height: 80vh;">
                    
                    <div id="empty-state" class="text-gray-500 text-center select-none absolute flex flex-col items-center">
                        <div class="w-16 h-16 rounded-full bg-[#2a2a2a] border border-gray-700 flex items-center justify-center mb-3">
                            <i class="fa-regular fa-image text-2xl text-gray-600"></i>
                        </div>
                        <span class="text-sm font-medium text-gray-400">Chưa có ảnh</span>
                        <span class="text-xs text-gray-600 mt-1">Vui lòng chọn ảnh từ thư viện</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 bg-[#fdfaf6] relative flex flex-col min-h-0">
            <div class="h-10 bg-amber-50 border-b border-amber-100 flex items-center justify-between px-4 flex-none">
                <span class="text-xs font-bold text-[#78350f] uppercase tracking-wide"><i class="fa-solid fa-file-lines mr-1"></i> Kết quả</span>
                
                <div class="flex gap-3">
                    <button onclick="copyText()" class="text-[#78350f] hover:text-amber-600 text-xs font-bold flex items-center gap-1 transition">
                        <i class="fa-regular fa-copy"></i> Sao chép
                    </button>
                    <div class="w-[1px] h-4 bg-amber-200"></div>
                    <button onclick="clearText()" class="text-red-500 hover:text-red-600 text-xs font-bold flex items-center gap-1 transition">
                        <i class="fa-regular fa-trash-can"></i> Xóa
                    </button>
                </div>
            </div>

            <textarea id="resultText" class="w-full h-full p-4 resize-none border-none outline-none text-base leading-relaxed text-gray-800 bg-[#fdfaf6] font-sans" placeholder="Văn bản sau khi trích xuất sẽ hiện ở đây..."></textarea>
            
            <div id="loading" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col justify-center items-center z-20 hidden">
                <div class="loader mb-3"></div>
                <p class="text-sm text-[#78350f] font-bold animate-pulse">Đang trích xuất văn bản...</p>
                <p class="text-xs text-gray-500 mt-1">Vui lòng đợi trong giây lát</p>
            </div>
        </div>
    </main>

    <nav style="padding-bottom: env(safe-area-inset-bottom);" class="h-16 bg-white border-t border-amber-100 flex items-center justify-between px-6 flex-none shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-30">
        
        <label for="fileInput" class="flex flex-col items-center justify-center w-16 cursor-pointer text-gray-400 hover:text-[#78350f] transition group">
            <div class="mb-1 group-hover:-translate-y-1 transition-transform duration-200">
                <i class="fa-solid fa-images text-xl"></i>
            </div>
            <span class="text-[10px] font-bold">Thư viện</span>
        </label>
        <input type="file" id="fileInput" accept="image/*" hidden>

        <button onclick="scanImage()" class="relative -top-5">
            <div class="w-16 h-16 bg-gradient-to-br from-[#78350f] to-[#b45309] rounded-full shadow-lg border-4 border-[#fdfaf6] flex items-center justify-center text-white text-2xl active:scale-95 transition-transform duration-200">
                <i class="fa-solid fa-expand"></i>
            </div>
            <span class="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-bold text-[#78350f] whitespace-nowrap">Quét Ngay</span>
        </button>

        <label for="cameraInput" class="flex flex-col items-center justify-center w-16 cursor-pointer text-gray-400 hover:text-[#78350f] transition group">
            <div class="mb-1 group-hover:-translate-y-1 transition-transform duration-200">
                <i class="fa-solid fa-camera text-xl"></i>
            </div>
            <span class="text-[10px] font-bold">Chụp ảnh</span>
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden onchange="handleCamera(this)">
    </nav>

    <div id="toast">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toast-message">Thông báo</span>
    </div>

    <script>
        const imageDisplay = document.getElementById('image-display');
        const emptyState = document.getElementById('empty-state');
        const resultText = document.getElementById('resultText');
        const loading = document.getElementById('loading');
        
        // --- CẤU HÌNH ZOOM (GIỮ NGUYÊN LOGIC) ---
        const element = document.getElementById('panzoom-content');
        const panzoom = Panzoom(element, {
            maxScale: 6, minScale: 0.5, startScale: 1, contain: null 
        });
        document.getElementById('panzoom-wrapper').addEventListener('wheel', panzoom.zoomWithWheel);

        function zoomIn() { panzoom.zoomIn(); }
        function zoomOut() { panzoom.zoomOut(); }
        function resetZoom() { panzoom.reset(); setTimeout(() => panzoom.pan(0, 0), 100); }

        // --- XỬ LÝ ẢNH ---
        function handleFile(file) {
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imageDisplay.src = e.target.result;
                    imageDisplay.classList.remove('hidden');
                    emptyState.classList.add('hidden');
                    panzoom.reset();
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('fileInput').addEventListener('change', (e) => handleFile(e.target.files[0]));
        
        // Xử lý nút Camera riêng (nếu dùng điện thoại)
        function handleCamera(input) {
            handleFile(input.files[0]);
        }

        // --- CORE LOGIC (GIỮ NGUYÊN) ---
        async function scanImage() {
            if (!imageDisplay.src || imageDisplay.src === window.location.href) {
                showToast("Vui lòng chọn ảnh trước!", true); 
                return;
            }
        
            loading.classList.remove('hidden');
            const lang = document.getElementById('langSelect').value;
        
            try {
                const compressedBase64 = await compressImage(imageDisplay.src);
        
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        imageBase64: compressedBase64,
                        language: lang 
                    })
                });
        
                const data = await response.json();
                
                if(data.text) {
                    resultText.value = data.text;
                    showToast("Trích xuất thành công!");
                } else {
                    resultText.value = "Không tìm thấy văn bản.";
                }
        
            } catch (err) {
                console.error(err);
                resultText.value = "Lỗi kết nối Server hoặc ảnh quá lớn.";
                showToast("Có lỗi xảy ra!", true);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // --- UI ACTIONS (CẬP NHẬT TOAST) ---
        function copyText() {
            if(resultText.value) {
                navigator.clipboard.writeText(resultText.value);
                showToast("Đã sao chép vào bộ nhớ tạm");
            } else {
                showToast("Không có nội dung để sao chép", true);
            }
        }

        function clearText() {
            if(resultText.value) {
                if(confirm("Bạn chắc chắn muốn xóa hết văn bản?")) {
                    resultText.value = "";
                    showToast("Đã xóa nội dung");
                }
            }
        }

        // --- TOAST FUNCTION ---
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const icon = toast.querySelector('i');

            msgEl.innerText = message;
            toast.style.backgroundColor = isError ? '#991b1b' : '#78350f'; // Red if error, Brown if success
            icon.className = isError ? "fa-solid fa-circle-exclamation" : "fa-solid fa-check-circle";

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- COMPRESS IMAGE (GIỮ NGUYÊN) ---
        function compressImage(base64Str, maxWidth = 1600, quality = 0.8) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        }
    </script>
</body>
</html>
